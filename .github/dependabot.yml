version: 2
updates:
  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "daily"
    open-pull-requests-limit: 10
    groups:
      major-updates:
        applies-to: version-updates
        update-types:
          - "major"
      minor-patch-updates:
        applies-to: version-updates
        update-types:
          - "minor"
          - "patch"
