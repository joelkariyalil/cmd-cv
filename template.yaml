
AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31

Description: Drop box for text

Parameters:
  TABLENAME:
    Type: String
    Description: DynamoDB table name
    Default: cmd-cv-table

  ENV:
    Type: String
    Description: Environment
    Default: local

Resources:
  CmdCvHttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      CorsConfiguration:
        AllowOrigins:
          - 'https://joelkariyalil.github.io'
        AllowHeaders:
          - Content-Type
        AllowMethods:
          - GET
          - POST
          - DELETE
          - OPTIONS
        MaxAge: 300

  CmdCvDynamodbTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Ref TABLENAME
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
      BillingMode: PAY_PER_REQUEST

  CmdCvLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: DynamoDBAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:PutItem
                  - dynamodb:UpdateItem
                  - dynamodb:DeleteItem
                  - dynamodb:GetItem
                  - dynamodb:Query
                Resource: !GetAtt CmdCvDynamodbTable.Arn

  CmdCvLambda:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ./bin/cmd-cv/artifact.zip
      Runtime: provided.al2023
      Handler: bootstrap
      Architectures:
        - x86_64
      Role: !GetAtt CmdCvLambdaRole.Arn
      Environment:
        Variables:
          ENV: !Ref ENV
          TABLE_NAME: !Ref TABLENAME
      Events:
        Create:
          Type: HttpApi
          Properties:
            ApiId: !Ref CmdCvHttpApi
            Path: /create
            Method: POST

        Delete:
          Type: HttpApi
          Properties:
            ApiId: !Ref CmdCvHttpApi
            Path: /delete
            Method: DELETE

        Retrieve:
          Type: HttpApi
          Properties:
            ApiId: !Ref CmdCvHttpApi
            Path: /retrieve/{id}
            Method: GET
