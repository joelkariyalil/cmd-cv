version = 0.1

[default.global.parameters]
region = "us-west-2"

[default.build.parameters]
cached = true
parallel = true

[default.deploy.parameters]
stack_name = "cmd-cv"
resolve_s3 = true
s3_prefix = "cmd-cv"
confirm_changeset = true
capabilities = "CAPABILITY_IAM"
parameter_overrides = "TABLENAME=\"cmd-cv-table\" ENV=\"local\""
image_repositories = []
disable_rollback = true
